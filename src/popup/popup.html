<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../ui/ui.css">
</head>
<body class="popup">
  <header class="titlebar">
    <img src="../../icons/icon32.png" width="20" height="20" alt="">
    <span class="app">Tab Doctor</span>
    <button class="gear" id="settings" title="All settings">⚙︎</button>
  </header>

  <section class="group">
    <ul class="list">
      <li class="row">
        <div class="text"><span class="label">Paused</span><span class="sub">Stop automatic actions</span></div>
        <input type="checkbox" class="switch" id="paused">
      </li>
    </ul>
  </section>

  <section class="group">
    <h2>Snoozed</h2>
    <ul class="list">
      <li class="row">
        <div class="text"><span class="label">Snooze this tab</span><span class="sub">Later today · Tomorrow · Weekend · pick a date</span></div>
        <div class="pills"><button class="pill" id="snoozeNow">Pick time</button></div>
      </li>
    </ul>
    <ul class="list" id="snoozed"></ul>
  </section>

  <section class="group">
    <h2>Recently closed</h2>
    <ul class="list" id="history"></ul>
  </section>

  <section class="actions">
    <button id="run" class="btn primary">Run Now</button>
    <button id="undo" class="btn tinted" disabled>Undo</button>
  </section>
  <p id="status" class="status"></p>
  <nav class="foot">
    <button class="footlink" id="settings2">All settings…</button>
    <a class="footlink" href="https://github.com/ChaituVR/tab-doctor/issues/new" target="_blank" rel="noopener">Request a feature ↗</a>
  </nav>
</body>
<script type="module" src="popup.js"></script>
</html>
