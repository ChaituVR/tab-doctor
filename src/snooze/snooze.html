<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Snooze tab</title>
  <link rel="stylesheet" href="../ui/ui.css">
  <link rel="stylesheet" href="snooze.css">
</head>
<body class="snooze">
  <header class="sheet-head">
    <img src="../../icons/icon48.png" width="36" height="36" alt="">
    <div class="sheet-text">
      <span class="sheet-title">Snooze tab</span>
      <span class="sheet-sub" id="tabTitle"></span>
    </div>
  </header>
  <section class="group">
    <ul class="list">
      <li class="row"><div class="text"><span class="label">Wake at</span></div><input type="datetime-local" id="when" class="dt"></li>
      <li class="row summary"><span class="sub" id="summary"></span></li>
    </ul>
  </section>
  <div class="segmented" id="presets" role="radiogroup" aria-label="Presets"></div>
  <section class="actions">
    <button id="cancel" class="btn tinted">Cancel</button>
    <button id="snooze" class="btn primary">Snooze</button>
  </section>
  <p id="status" class="status" hidden></p>
</body>
<script type="module" src="snooze.js"></script>
</html>
